name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0). Created on the current commit if it doesn't exist."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MILEA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret MILEA_KEYSTORE_BASE64 is not set; a release APK can't be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MILEA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        env:
          MILEA_KEYSTORE_PASSWORD: ${{ secrets.MILEA_KEYSTORE_PASSWORD }}
          MILEA_KEY_ALIAS: ${{ secrets.MILEA_KEY_ALIAS }}
          MILEA_KEY_PASSWORD: ${{ secrets.MILEA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Milea-$TAG.apk"
          (cd dist && sha256sum "Milea-$TAG.apk" > "Milea-$TAG.apk.sha256")

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Milea ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/Milea-${{ env.TAG }}.apk
            dist/Milea-${{ env.TAG }}.apk.sha256

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
